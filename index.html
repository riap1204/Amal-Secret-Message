
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>A Phool for My Fool</title>
  <style>
    body {
      background-color: #fff0f5;
      margin: 0;
      height: 100vh;
      overflow: hidden;
      font-family: 'Comic Sans MS', cursive, sans-serif;
      cursor: pointer;
      position: relative;
    }

    .bubble {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      font-size: 2rem;
      color: #d1007f;
      background: #ffe6f0;
      padding: 20px;
      border-radius: 25px;
      box-shadow: 0 6px 12px rgba(0,0,0,0.1);
      animation: floatUp 2.8s ease-out forwards;
    }

    .rose {
      font-size: 4rem;
      line-height: 1;
      margin-bottom: 10px;
    }

    .text {
      font-size: 1.4rem;
      color: #88004c;
    }

    @keyframes floatUp {
      0% {
        bottom: 60px;
        opacity: 0;
        transform: translateX(-50%) scale(0.95);
      }
      10% {
        opacity: 1;
        transform: translateX(-50%) scale(1.05);
      }
      100% {
        bottom: 100%;
        opacity: 0;
        transform: translateX(-50%) scale(0.85);
      }
    }
  </style>
</head>
<body onclick="showBubble()">

  <script>
    function showBubble() {
      const bubble = document.createElement('div');
      bubble.className = 'bubble';

      bubble.innerHTML = `
        <div class="rose">🌹</div>
        <div class="text">A phool for my fool so you don't gloom and can sleep in your room.</div>
      `;

      // Random horizontal offset
      const offset = Math.random() * 60 + 20;
      bubble.style.left = `${offset}%`;

      document.body.appendChild(bubble);

      // Remove after float
      setTimeout(() => {
        bubble.remove();
      }, 2800);
    }
  </script>

</body>
</html>
