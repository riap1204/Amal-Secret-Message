<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>A Phool for My Fool</title>
  <style>
    body {
      background-color: #fcefee;
      margin: 0;
      height: 100vh;
      font-family: 'Comic Sans MS', cursive, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
    }

    .message {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }

    .message img {
      width: 150px;
      height: auto;
      margin-bottom: 20px;
    }

    .text {
      font-size: 1.4rem;
      color: #b4005a;
      background: #fff0f8;
      padding: 15px 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body onclick="showMessage()">

  <div class="message" id="flowerMessage">
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/36/Simple_flower.svg/1024px-Simple_flower.svg.png" alt="Flower"/>
    <div class="text">
      A phool for my fool so you don't gloom and can sleep in your room.
    </div>
  </div>

  <script>
    function showMessage() {
      document.getElementById('flowerMessage').style.display = 'block';
    }
  </script>

</body>
</html>
